<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('lunchapp-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=23">
</head>
<body data-page="login">
  <main class="login-box">
    <h1>Lunch App</h1>
    <p class="subtitle">Đăng nhập để đặt bữa trưa</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="username"
               inputmode="email" autocapitalize="none">
      </div>

      <div class="field">
        <label for="password">Mật khẩu<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <div class="auth-meta">
        <a href="forgot-password.html">Quên mật khẩu?</a>
      </div>

      <p id="login-error" class="message-error" role="alert" style="display:none; margin:0;"></p>

      <button type="submit">Đăng nhập</button>
    </form>

    <div id="google-block" hidden>
      <div class="auth-divider">hoặc</div>
      <div id="google-signin-wrap"></div>
    </div>

    <p class="auth-switch">
      Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </p>
  </main>
  <script type="module" src="js/main.js?v=23"></script>
</body>
</html>
