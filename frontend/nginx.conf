# Không cache HTML/JS/CSS ở phía trình duyệt.
#
# Ứng dụng là ES module không qua build/bundle: mỗi file .js import file khác
# bằng đường dẫn tương đối KHÔNG có query-string version, nên nếu trình duyệt
# tự cache theo "heuristic freshness" (mặc định của Chrome khi thiếu
# Cache-Control), một module con bị deploy mới vẫn có thể phục vụ bản cũ từ
# cache dù index.html đã đổi ?v= — người dùng phải bấm Ctrl+F5 mới thấy code mới.
# Buộc no-cache ở đây để mỗi lần tải trang luôn xác thực lại với server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
