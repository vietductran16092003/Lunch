<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt bữa trưa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=17">
</head>
<body data-page="menu">
  <a href="#main" class="sr-only">Bỏ qua điều hướng, tới nội dung chính</a>
  <div id="navbar-placeholder"></div>

  <main class="container" id="main">
    <h1 id="menu-heading-title">Thực đơn</h1>
    <p class="subtitle" id="today-date">Đang tải thực đơn…</p>

    <!-- Chọn ngày: có thực đơn hôm sau thì đặt trước được luôn -->
    <div class="date-picker" id="date-picker" role="group" aria-label="Chọn ngày đặt món" hidden></div>

    <!-- Tiến trình đơn hàng, cập nhật theo trạng thái đơn của chính người đang xem -->
    <ol class="stepper" id="order-stepper" aria-label="Tiến trình đơn hàng hôm nay"></ol>

    <div id="cutoff-notice"></div>

    <section aria-labelledby="menu-heading">
      <h2 id="menu-heading" class="sr-only">Danh sách món ăn</h2>
      <div id="menu-list" class="menu-grid" aria-busy="true">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </section>

    <div class="summary-bar">
      <div class="totals">
        <span class="stat-value" id="selection-total">0 đ</span>
        <span class="stat-label" id="selection-count">Chưa chọn món nào</span>
      </div>
      <p id="order-message" role="status" aria-live="polite" style="margin:0;"></p>
      <div class="actions">
        <button type="button" class="ghost" id="payment-method-btn">Thanh toán</button>
        <button type="button" id="place-order-btn">Đặt món</button>
      </div>
    </div>

    <section aria-labelledby="my-order-heading">
      <h2 id="my-order-heading">Đơn hàng của tôi</h2>
      <div id="my-order" class="card">Đang tải…</div>
    </section>
  </main>

  <!-- Hộp thoại thanh toán: quét QR chuyển khoản -> đóng và chờ người đặt xác nhận -->
  <div id="payment-modal-overlay" class="modal-overlay" style="display:none;" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="payment-modal-title">
      <h3 id="payment-modal-title">Chuyển khoản</h3>

      <!-- Bước 1: thông tin người nhận + mã QR -->
      <div class="modal-step" id="payment-step-choose">
        <div id="order-summary-panel"></div>
        <div id="payment-info-panel"></div>
        <p id="payment-modal-message" role="status" aria-live="polite" style="margin:0;"></p>

        <button type="button" id="payment-confirm-btn">Tôi đã chuyển khoản</button>
        <button type="button" class="modal-cancel" id="payment-modal-cancel">Để sau</button>
      </div>

      <!-- Bước 2: đã báo chuyển, chờ người đặt xác nhận đã nhận tiền -->
      <div class="modal-step" id="payment-step-success" hidden>
        <div class="pay-success">
          <div class="pay-check is-waiting" aria-hidden="true">⏳</div>
          <h3 id="pay-success-title">Đã gửi báo chuyển khoản</h3>
          <p class="pay-amount" id="pay-success-amount"></p>
          <p class="pay-meta" id="pay-success-meta"></p>
        </div>
        <button type="button" id="payment-success-close">Đóng</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=17"></script>
</body>
</html>
