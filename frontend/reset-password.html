<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('lunchapp-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=23">
</head>
<body data-page="reset-password">
  <main class="login-box">
    <h1>Đặt lại mật khẩu</h1>
    <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="reset-password">Mật khẩu mới<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="password" id="reset-password" name="reset-password" required
               autocomplete="new-password" aria-describedby="reset-password-help reset-password-error">
        <span class="helper" id="reset-password-help">Ít nhất 8 ký tự.</span>
        <span class="field-error" id="reset-password-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="reset-password2">Nhập lại mật khẩu mới<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="password" id="reset-password2" name="reset-password2" required
               autocomplete="new-password" aria-describedby="reset-password2-error">
        <span class="field-error" id="reset-password2-error" role="alert"></span>
      </div>

      <p id="reset-error" class="message-error" role="alert" style="display:none; margin:0;"></p>

      <button type="submit">Đổi mật khẩu</button>
    </form>

    <div id="reset-result" role="status" aria-live="polite"></div>

    <p class="auth-switch">
      <a href="login.html">Quay lại đăng nhập</a>
    </p>
  </main>
  <script type="module" src="js/main.js?v=23"></script>
</body>
</html>
