<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20">
</head>
<body data-page="forgot-password">
  <main class="login-box">
    <h1>Quên mật khẩu</h1>
    <p class="subtitle">Nhập email của bạn, hệ thống sẽ tạo link đặt lại mật khẩu.</p>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="forgot-email">Email<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="email" id="forgot-email" name="forgot-email" required
               autocomplete="username" inputmode="email" autocapitalize="none">
      </div>

      <button type="submit">Tạo link đặt lại</button>
    </form>

    <div id="forgot-result" role="status" aria-live="polite"></div>

    <p class="auth-switch">
      Nhớ ra rồi? <a href="login.html">Quay lại đăng nhập</a>
    </p>
  </main>
  <script type="module" src="js/main.js?v=20"></script>
</body>
</html>
